- name: Setup clevis 
  hosts: "{{ my_host | default('servera') }}"
  become: true
  gather_facts: false

  vars:

    tangservers:
      - serverb
      - serverc
      - serverd

    nbde_client_bindings:
      - device: "{{ securedevice }}"
        # This would be stored using Ansible Vault
        encryption_password: "{{ encryption_password }}"
        servers: "{{ tangservers | map('regex_replace', '^', 'http://') | list }}"
        threshold: 2

    securedevice: /dev/vdb
    # This would be stored using Ansible Vault
    encryption_password: secretMODE

  roles:
    - rhel-system-roles.nbde_client
