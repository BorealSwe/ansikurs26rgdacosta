---
- name: Handle critical alerts from monitoring
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Display alert information
      ansible.builtin.debug:
        msg: |
          CRITICAL ALERT RECEIVED:
          Source: {{ ansible_eda.event.payload.source | default('unknown') }}
          Message: {{ ansible_eda.event.payload.message | default('no message') }}
          Host: {{ ansible_eda.event.payload.host | default('unknown') }}
          Time: {{ ansible_eda.event.payload.timestamp | default('unknown') }}

    - name: Log to syslog
      ansible.builtin.command:
        cmd: logger -t eda-critical "Critical alert received"
      changed_when: false

    - name: Create incident response directory
      ansible.builtin.file:
        path: "/tmp/eda-incidents"
        state: directory
        mode: '0755'

    - name: Save alert details to file
      ansible.builtin.copy:
        content: "{{ ansible_eda.event.payload | to_nice_json }}"
        dest: "/tmp/eda-incidents/alert-latest.json"
        mode: '0644'
