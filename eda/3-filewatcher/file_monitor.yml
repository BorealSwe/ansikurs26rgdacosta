---
- name: Monitor critical directories for file system changes
  hosts: localhost

  sources:
    - name: Watch configuration directory
      ansible.eda.file_watch:
        path: /tmp/watched-config
        recursive: true

    - name: Watch log directory
      ansible.eda.file_watch:
        path: /tmp/watched-logs
        recursive: true

  rules:
    - name: Any file event in config directory
      condition: event.file.src_path is defined
      action:
        debug:
          msg: |
            📁 FILE EVENT DETECTED
            ================================================
            File: {{ event.file.src_path }}
            Event: {{ event.file.event_type }}
            ================================================
