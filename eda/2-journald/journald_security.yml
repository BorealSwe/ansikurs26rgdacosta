---
- name: Monitor system journal for security events
  hosts: localhost

  sources:
    - name: Monitor system journal
      ansible.eda.journald:
        match: "ALL"

  rules:
    - name: Failed SSH login attempt
      condition: >
        event.journald.SYSLOG_IDENTIFIER == "sshd" and
        event.journald.MESSAGE is search ".*Failed password.*"
      action:
        run_playbook:
          name: handle_failed_ssh.yml

    - name: SELinux denial detected
      condition: >
        event.journald._COMM == "setenforce" or
        event.journald.MESSAGE is search ".*SELinux.*denied.*" or
        event.journald.MESSAGE is search ".*avc.*denied.*"
      action:
        run_playbook:
          name: handle_selinux_denial.yml

    - name: Sudo command executed
      condition: >
        event.journald._COMM == "sudo" and
        event.journald.MESSAGE is search ".*COMMAND=.*"
      action:
        run_playbook:
          name: handle_sudo_usage.yml

    - name: Service failed to start
      condition: >
        event.journald.MESSAGE is search ".*Failed to start.*" or
        event.journald.MESSAGE is search ".*failed.*service.*"
      action:
        debug:
          msg: |
            SERVICE FAILURE DETECTED:
            Message: {{ event.journald.MESSAGE }}
            Unit: {{ event.journald.UNIT | default('unknown') }}
            Priority: {{ event.journald.PRIORITY }}
