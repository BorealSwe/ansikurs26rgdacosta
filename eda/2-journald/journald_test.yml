---
- name: Test journal monitoring with specific units
  hosts: localhost

  sources:
    - name: Monitor system journal
      ansible.eda.journald:
        units:
          - sshd.service
          - systemd-logind.service

  rules:
    - name: Show raw journal event
      condition: event is defined
      action:
        debug:
          msg: "EVENT: {{ event }}"
