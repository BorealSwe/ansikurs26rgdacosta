---
- name: Test journal monitoring
  hosts: localhost

  sources:
    - name: Monitor system journal
      ansible.eda.journald:
        match: "ALL"

  rules:
    - name: Any journal event
      condition: event.journald is defined
      action:
        debug:
          msg: |
            📋 JOURNAL EVENT DETECTED
            ================================================
            COMM: {{ event.journald._COMM | default('N/A') }}
            MESSAGE: {{ event.journald.MESSAGE | default('N/A') }}
            SYSLOG_ID: {{ event.journald.SYSLOG_IDENTIFIER | default('N/A') }}
            ================================================
