---
- name: Ensure webserver is installed
  hosts: servera
  become: true

  tasks:

    - name: Ensure httpd is installed
      ansible.builtin.dnf:
        name: httpd
        state: present

    - name: Ensure webserver is enabled
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true

    - name: Ensure port open in firewall
      ansible.posix.firewalld:
        service: http
        state: enabled
        permanent: true
        immediate: true

    - name: Ensure stub content is deployed
      ansible.builtin.copy:
        content: |
          Hello world

          I am a web server running httpd aka apache
        dest: /var/www/html/index.html
        mode: 0644

- name: Test web server deployment
  hosts: localhost
  become: false

  tasks:

    - name: Test webserver
      ansible.builtin.uri:
        url: http://servera.lab.example.com
        return_content: true
