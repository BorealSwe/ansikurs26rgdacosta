---
- name: Deploy World API
  hosts: api
  become: true
  gather_facts: false

  vars_files:
    - vars/common.yml

  handlers:
    - name: Restart World API
      ansible.builtin.systemd_service:
        name: "{{ api_service_name }}"
        state: restarted
        daemon_reload: true

  tasks:
    - name: Enable Node.js 20 module stream
      ansible.builtin.dnf:
        name: "{{ api_node_module }}"
        state: present

    - name: Create API service user
      ansible.builtin.user:
        name: "{{ api_service_user }}"
        system: true
        shell: /sbin/nologin
        home: "{{ api_install_dir }}"
        create_home: true

    - name: Deploy API source code
      ansible.builtin.copy:
        src: files/world_api/
        dest: "{{ api_install_dir }}/"
        owner: "{{ api_service_user }}"
        group: "{{ api_service_user }}"
        mode: "0644"
        directory_mode: "0755"
      notify: Restart World API

    - name: Install Node.js dependencies
      ansible.builtin.command:
        cmd: npm ci --production
        chdir: "{{ api_install_dir }}"
        creates: "{{ api_install_dir }}/node_modules"
      become_user: "{{ api_service_user }}"

    - name: Template API environment file
      ansible.builtin.template:
        src: templates/world-api.conf.j2
        dest: /etc/sysconfig/{{ api_service_name }}
        owner: root
        group: "{{ api_service_user }}"
        mode: "0640"
      notify: Restart World API

    - name: Template API systemd unit
      ansible.builtin.template:
        src: templates/world-api.service.j2
        dest: /etc/systemd/system/{{ api_service_name }}.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart World API

    - name: Enable and start World API
      ansible.builtin.systemd_service:
        name: "{{ api_service_name }}"
        state: started
        enabled: true
        daemon_reload: true

    - name: Open firewall for API
      ansible.posix.firewalld:
        port: "{{ world_api_port }}/tcp"
        permanent: true
        immediate: true
        state: enabled
