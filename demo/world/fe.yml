---
- name: Deploy World Frontend
  hosts: fe
  become: true
  gather_facts: false

  vars_files:
    - vars/common.yml

  tasks:
    - name: Ensure Node.js 20 module stream is enabled
      ansible.builtin.dnf:
        name: "{{ fe_node_module }}"
        state: present

    - name: Ensure nginx is installed
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Ensure frontend build directory is present
      ansible.builtin.file:
        path: "{{ fe_build_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure frontend source code is deployed
      ansible.builtin.copy:
        src: files/world_fe/
        dest: "{{ fe_build_dir }}/"
        mode: "0644"
        directory_mode: "0755"

    - name: Ensure Node.js dependencies are installed
      ansible.builtin.command:
        cmd: npm ci
        chdir: "{{ fe_build_dir }}"
        creates: "{{ fe_build_dir }}/node_modules"

    - name: Ensure React frontend is built
      ansible.builtin.command:
        cmd: npm run build
        chdir: "{{ fe_build_dir }}"
        creates: "{{ fe_build_dir }}/dist/index.html"

    - name: Ensure built frontend is deployed to nginx document root
      ansible.builtin.command:
        cmd: >
          rsync -a --delete
          {{ fe_build_dir }}/dist/
          {{ fe_document_root }}/
      changed_when: true

    - name: Ensure SELinux context is restored on document root
      ansible.builtin.command:
        cmd: restorecon -Rv {{ fe_document_root }}
      changed_when: true

    - name: Ensure nginx configuration is templated
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: "0644"
      notify: Ensure nginx is restarted

    - name: Ensure SELinux boolean is set for nginx proxy
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true

    - name: Ensure nginx is enabled and started
      ansible.builtin.systemd_service:
        name: nginx
        state: started
        enabled: true

    - name: Ensure firewall is open for HTTP
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled

  handlers:
    - name: Ensure nginx is restarted
      ansible.builtin.systemd_service:
        name: nginx
        state: restarted
