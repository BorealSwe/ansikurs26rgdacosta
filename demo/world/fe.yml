---
- name: Deploy World Frontend
  hosts: fe
  become: true
  gather_facts: false

  vars_files:
    - vars/common.yml

  handlers:
    - name: Restart nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: restarted

  tasks:
    - name: Enable Node.js 20 module stream
      ansible.builtin.dnf:
        name: "{{ fe_node_module }}"
        state: present

    - name: Install nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Create frontend build directory
      ansible.builtin.file:
        path: "{{ fe_build_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy frontend source code
      ansible.builtin.copy:
        src: files/world_fe/
        dest: "{{ fe_build_dir }}/"
        mode: "0644"
        directory_mode: "0755"

    - name: Install Node.js dependencies
      ansible.builtin.command:
        cmd: npm ci
        chdir: "{{ fe_build_dir }}"
        creates: "{{ fe_build_dir }}/node_modules"

    - name: Build React frontend
      ansible.builtin.command:
        cmd: npm run build
        chdir: "{{ fe_build_dir }}"
        creates: "{{ fe_build_dir }}/dist/index.html"

    - name: Deploy built frontend to nginx document root
      ansible.builtin.command:
        cmd: >
          rsync -a --delete
          {{ fe_build_dir }}/dist/
          {{ fe_document_root }}/
      changed_when: true

    - name: Restore SELinux context on document root
      ansible.builtin.command:
        cmd: restorecon -Rv {{ fe_document_root }}
      changed_when: true

    - name: Template nginx configuration
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart nginx

    - name: Set SELinux boolean for nginx proxy
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true

    - name: Enable and start nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: started
        enabled: true

    - name: Open firewall for HTTP
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled
