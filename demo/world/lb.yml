---
- name: Configure HAProxy load balancer
  hosts: lb
  become: true
  gather_facts: false

  vars_files:
    - vars/common.yml

  tasks:
    - name: Ensure HAProxy is installed
      ansible.builtin.dnf:
        name: haproxy
        state: present

    - name: Ensure HAProxy configuration is templated
      ansible.builtin.template:
        src: templates/haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: "0644"
      notify: Ensure HAProxy is restarted

    - name: Ensure SELinux boolean is set for HAProxy connections
      ansible.posix.seboolean:
        name: haproxy_connect_any
        state: true
        persistent: true

    - name: Ensure HAProxy is enabled and started
      ansible.builtin.systemd_service:
        name: haproxy
        state: started
        enabled: true

    - name: Ensure firewall is open for HTTP
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled

  handlers:
    - name: Ensure HAProxy is restarted
      ansible.builtin.systemd_service:
        name: haproxy
        state: restarted
