---
- name: Configure MariaDB database server
  hosts: db
  become: true
  gather_facts: false

  vars_files:
    - vars/common.yml

  tasks:
    - name: Ensure MariaDB and Python MySQL library are installed
      ansible.builtin.dnf:
        name: "{{ db_packages }}"
        state: present

    - name: Ensure case-insensitive table names are configured
      ansible.builtin.copy:
        dest: /etc/my.cnf.d/world.cnf
        mode: "0644"
        content: |
          [mysqld]
          lower_case_table_names=1
      notify: Ensure MariaDB is restarted

    - name: Ensure MariaDB is enabled and started
      ansible.builtin.systemd_service:
        name: "{{ db_service }}"
        state: started
        enabled: true

    - name: Ensure pending configuration is applied
      ansible.builtin.meta: flush_handlers

    - name: Ensure MariaDB root password is set
      community.mysql.mysql_user:
        name: root
        password: "{{ world_db_root_password }}"
        login_user: root
        login_password: "{{ world_db_root_password }}"
        check_implicit_admin: true
        state: present

    - name: Ensure root credentials file is present
      ansible.builtin.copy:
        dest: /root/.my.cnf
        mode: "0600"
        content: |
          [client]
          user=root
          password={{ world_db_root_password }}

    - name: Ensure application database is present
      community.mysql.mysql_db:
        name: "{{ world_db_name }}"
        state: present

    - name: Ensure application database user is present
      community.mysql.mysql_user:
        name: "{{ world_db_user }}"
        password: "{{ world_db_password }}"
        priv: "{{ world_db_name }}.*:ALL"
        host: "%"
        state: present

    - name: Ensure database dump is present on server
      ansible.builtin.copy:
        src: files/world.sql
        dest: "{{ db_sql_file }}"
        mode: "0644"

    - name: Ensure database import state is determined
      ansible.builtin.stat:
        path: "{{ db_import_marker }}"
      register: db_imported

    - name: Ensure database dump is imported
      community.mysql.mysql_db:
        name: "{{ world_db_name }}"
        state: import
        target: "{{ db_sql_file }}"
      when: not db_imported.stat.exists

    - name: Ensure import marker file is present
      ansible.builtin.file:
        path: "{{ db_import_marker }}"
        state: touch
        mode: "0644"
      when: not db_imported.stat.exists

    - name: Ensure firewall is open for MariaDB
      ansible.posix.firewalld:
        port: "{{ world_db_port }}/tcp"
        permanent: true
        immediate: true
        state: enabled

  handlers:
    - name: Ensure MariaDB is restarted
      ansible.builtin.systemd_service:
        name: "{{ db_service }}"
        state: restarted
