---
- name: Ensure webservers are installed
  hosts: "{{ my_host | default('servera') }}"
  become: true
  become: true
  force_handlers: true

  tasks:

    - name: Ensure software is managed
      ansible.builtin.dnf:
        name: "{{ my_webservice }}"
        state: "{{ my_state }}"

    - name: Ensure webserver is configured with systemd
      ansible.builtin.service:
        name: "{{ my_webservice }}"
        state: "{{ my_systemd_state }}"
        enabled: "{{ my_systemd_enabled }}"

    - name: Ensure port open in firewall
      ansible.posix.firewalld:
        service: "{{ my_fw_service }}"
        state: "{{ my_fw_state }}"
        permanent: "{{ my_fw_permanance }}"
        immediate: "{{ my_fw_immediate }}"

    - name: Ensure stub content is deployed
      ansible.builtin.copy:
        content: "{{ my_web_content }}"
        dest: /var/www/html/index.html

    - name: Ensure fact controller learns
      ansible.builtin.set_fact:
        my_webserver: "{{ my_host }}"
        cacheable: true

    - name: Ensure stub content is deployed
      ansible.builtin.copy:
        content: |
          Hello world

          I am a web server running httpd aka apache
        dest: /var/www/html/index.html
        mode: 0644

- name: Test web server deployment
  hosts: localhost
  become: false

  tasks:

    - name: Test webserver
      register: my_result
      ansible.builtin.uri:
        url: "{{ my_webserver }}"
        return_content: true

    - name: Ensure content is returned
      ansible.builtin.debug:
        msg: "{{ my_result['content'] }}"
