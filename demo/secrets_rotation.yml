---
- name: Secrets rotation
  hosts: "{{ my_host | default('servera') }}"
  become: true
  gather_facts: false
  force_handlers: true

  vars:

    my_db_user: "{{ my_db_username | default('appuser') }}"
    my_db_name: "{{ my_database | default('appdb') }}"
    my_app_config: /etc/myapp/database.conf
    my_app_service: httpd
    my_password_length: 16

  tasks:

    - name: Rotate database password
      block:

        - name: Ensure new password is generated
          ansible.builtin.set_fact:
            new_db_password: "{{ lookup('password', '/dev/null length=' + (my_password_length | string) + ' chars=ascii_letters,digits') }}"

        - name: Ensure database user password is updated
          ansible.builtin.command: >
            mysql -e "ALTER USER '{{ my_db_user }}'@'localhost'
            IDENTIFIED BY '{{ new_db_password }}';"
          changed_when: true
          no_log: true

        - name: Ensure application config is updated
          notify: Ensure application service is restarted
          ansible.builtin.lineinfile:
            path: "{{ my_app_config }}"
            regexp: '^password\s*='
            line: "password = {{ new_db_password }}"
            create: true
            mode: "0640"
            owner: root
            group: "{{ my_app_service }}"
          no_log: true

        - name: Ensure database connectivity is validated
          ansible.builtin.command: >
            mysql -u {{ my_db_user }} -p{{ new_db_password }}
            -e "SELECT 1;" {{ my_db_name }}
          changed_when: false
          no_log: true

        - name: Report rotation success
          ansible.builtin.debug:
            msg: >-
              Password rotated for {{ my_db_user }}@{{ inventory_hostname }}.
              Application config updated. Service restart pending.

      rescue:

        - name: Report rotation failure
          ansible.builtin.debug:
            msg: >-
              Password rotation FAILED for {{ my_db_user }}@{{ inventory_hostname }}.
              Manual intervention may be required.
              Check database and application config consistency.

  handlers:

    - name: Ensure application service is restarted
      ansible.builtin.systemd:
        name: "{{ my_app_service }}"
        state: restarted
