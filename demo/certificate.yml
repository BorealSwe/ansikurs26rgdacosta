- name: Setup TLS
  hosts: "{{ my_host | default('all') }}"
  become: true
  gather_facts: true
  force_handlers: true

  vars:
    certificate_requests:
      - name: "{{ mycert | default(inventory_hostname) }}"
        dns: "{{ inventory_hostname }}"
        ca: self-sign

  roles:
    - linux-system-roles.certificate
