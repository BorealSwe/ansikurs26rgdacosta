- name: Display Cached Fact
  hosts: "{{ my_hosts | default('all') }}"
  gather_facts: false

  tasks:
    - name: Display a cached fact
      ansible.builtin.debug:
        msg: >
          "{{ inventory_hostname }} runs {{ hostvars[inventory_hostname]['distribution'] }}
          version {{ hostvars[inventory_hostname]['distribution_major_version'] }}"
