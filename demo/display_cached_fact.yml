- name: Display Cached Fact
  hosts: "{{ my_hosts | default('all') }}"
  gather_facts: false

  tasks:
    - name: Display a cached fact
      ansible.builtin.debug:
        msg: >
            "{{ inventory_hostname }} runs {{ hostvars[inventory_hostname]['ansible_facts']['distribution'] }}
             version {{ hostvars[inventory_hostname]['ansible_facts']['distribution_major_version'] }}"
