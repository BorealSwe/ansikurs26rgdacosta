---
- name: Reboot a server
  hosts: "{{ my_host | default('servera') }}"
  gather_facts: true
  become: true

  tasks:

    - name: Ensure server is rebooted
      ansible.builtin.reboot:
        pre_reboot_delay: "{{ my_delay | default('300') }}"
        msg: "{{ my_msg | default('Rebooting server - please save all work') }}"

    - name: Ensure that we can connect to server
      ansible.builtin.wait_for:
        port: 22
        delay: 10
        timeout: 600
