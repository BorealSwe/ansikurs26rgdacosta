- name: Consistent network data
  hosts: servera
  become: true
  gather_facts: false

  vars_files:
    - network_vars.yml

  tasks:

    - name: Ensure limited facts are gathered
      ansible.builtin.setup:
        gather_subset: network

    - name: Ensure /etc/hosts is correctly set
      ansible.builtin.template:
        dest: /etc/hosts
        src: hosts.j2
