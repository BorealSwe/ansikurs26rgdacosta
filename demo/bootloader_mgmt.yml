- name: Manage bootloader
  hosts: "{{ my_host | default('servera') }}"
  gather_facts: true
  become: true

  vars:
    bootloader_settings:
      - kernel: DEFAULT
        options:
          - name: console=ttyS0,115200n8
            state: absent
    bootloader_timeout: 5
    bootloader_password: "{{ my_password }}"
    bootloader_remove_password: false
    bootloader_reboot_ok: true

  roles:
    - redhat.rhel_system_roles.bootloader
