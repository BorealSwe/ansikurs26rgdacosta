---
- name: Create the Beatles users, and give them access to their databases
  hosts: "{{ my_host | default('servera') }}"
  gather_facts: false
  become: true
  force_handlers: true

  vars_files:
    - nested_vars.yml

  tasks:

    - name: Ensure users exist
      loop: "{{ my_user }}"
      ansible.builtin.user:
        name: "{{ item }}"
        state: present

    - name: Ensure software is installed
      ansible.builtin.package:
        name: "{{ my_packages }}"
        state: present

    - name: Ensure mariadb is started and enabled
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true

    - name: Ensure databases exist
      loop: "{{ my_db }}"
      community.mysql.mysql_db:
        name: "{{ item }}"
        state: present

    - name: Ensure Beatles access to their databases
      loop: "{{ my_user | product(my_db) | list }}"
      community.mysql.mysql_user:
        host: localhost
        login_unix_socket: /var/lib/mysql/mysql.sock
        name: "{{ item[0] }}"
        priv: "{{ item[1] }}.*:ALL"
        append_privs: yes
        password: "{{ my_pass }}"
