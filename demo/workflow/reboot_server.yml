- name: Reboot server
  hosts: "{{ my_host | default('all') }}"
  gather_facts: false
  become: true

  tasks:
    - name: Reboot the server
      ansible.builtin.reboot:
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami

    - name: Wait for server to come back online
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 600
