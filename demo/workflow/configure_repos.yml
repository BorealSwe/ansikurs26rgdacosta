---
- name: Ensure that yum repositories are configured
  hosts: "{{ my_host | default('all') }}"
  gather_facts: false
  become: true

  vars:
    repos:
      baseos:
        url: http://content.example.com/rhel8.6/x86_64/dvd/BaseOS
      appstream:
        url: http://content.example.com/rhel8.6/x86_64/dvd/AppStream

  tasks:

    - name: Ensure that yum repositories are defined
      loop: "{{ repos | dict2items }}"
      ansible.builtin.yum_repository:
        name: "{{ item['key'] }}"
        file: "ansible_{{ tower_job_id }}"
        description: "Ansible Defined repo for {{ item['key'] }}"
        baseurl: "{{ item['value']['url'] }}"
        enabled: "{{ my_state | default('true') }}"
        gpgcheck: false
