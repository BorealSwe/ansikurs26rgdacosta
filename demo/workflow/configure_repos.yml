---
- name: Ensure that yum repositories are configured
  hosts: "{{ my_host | default('all') }}"
  gather_facts: false
  become: true

  vars:
    repo_map:
      "RHEL 8.6 BaseOS": "http://content.example.com/rhel8.6/x86_64/dvd/BaseOS"
      "RHEL 8.6 AppStream": "http://content.example.com/rhel8.6/x86_64/dvd/AppStream"

  tasks:
    - name: Ensure that my_repo is normalised into a list
      ansible.builtin.set_fact:
        repo_list: "{{ my_repo if my_repo is iterable and my_repo is not string else [my_repo] }}"

    - name: Ensure that yum repositories are defined
      loop: "{{ repo_list }}"
      loop_control:
        loop_var: item
        index_var: index
      ansible.builtin.yum_repository:
        name: "{{ repo_map[item].split('/') | last }}"
        file: "ansible_{{ tower_job_id }}"
        description: "Ansible Defined repo for {{ repo_map[item] }}"
        baseurl: "{{ repo_map[item] }}"
        enabled: "{{ my_state | default('true') }}"
        gpgcheck: false
