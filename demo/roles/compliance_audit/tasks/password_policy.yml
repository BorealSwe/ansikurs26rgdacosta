---
- name: Ensure pwquality config is read
  tags:
    - audit
  register: pwquality_content
  ansible.builtin.slurp:
    src: /etc/security/pwquality.conf
  failed_when: false

- name: Ensure password minlen is extracted
  tags:
    - audit
  ansible.builtin.set_fact:
    compliance_current_minlen: >-
      {{ (pwquality_content.content | default('') | b64decode)
         | regex_search('^minlen\s*=\s*(\d+)', '\1', multiline=true)
         | default(['0'], true) | first }}

- name: Report password policy status
  tags:
    - audit
  ansible.builtin.debug:
    msg: >-
      Password minlen:
      {{ compliance_current_minlen }}
      (required: {{ compliance_min_password_length }})
      -
      {{ 'PASS' if (compliance_current_minlen | int) >= compliance_min_password_length else 'FAIL' }}

- name: Ensure login.defs is read
  tags:
    - audit
  register: logindefs_content
  ansible.builtin.slurp:
    src: /etc/login.defs

- name: Ensure PASS_MAX_DAYS is extracted
  tags:
    - audit
  ansible.builtin.set_fact:
    compliance_current_max_days: >-
      {{ (logindefs_content.content | b64decode)
         | regex_search('^PASS_MAX_DAYS\s+(\d+)', '\1', multiline=true)
         | default(['99999'], true) | first }}

- name: Report password aging status
  tags:
    - audit
  ansible.builtin.debug:
    msg: >-
      PASS_MAX_DAYS: {{ compliance_current_max_days }}
      (required: <= {{ compliance_max_password_days }})
      -
      {{ 'PASS' if (compliance_current_max_days | int) <= compliance_max_password_days else 'FAIL' }}

- name: Remediate password quality
  tags:
    - remediate
    - never
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^#?\s*minlen'
    line: "minlen = {{ compliance_min_password_length }}"

- name: Remediate password aging
  tags:
    - remediate
    - never
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^PASS_MAX_DAYS'
    line: "PASS_MAX_DAYS\t{{ compliance_max_password_days }}"
