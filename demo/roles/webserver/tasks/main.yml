---
- name: Ensure needed variables are defined
  ansible.builtin.assert:
    that:
      - my_webservice in ['httpd', 'nginx']
      - my_action in ['install', 'uninstall']
    success_msg: |

      🎉                 🎉                  🎉

      The needed variables are set, proceeding

      🎉                 🎉                  🎉
    fail_msg: |

      ❌                  ❌                  ❌                  ❌

      OH NO! We need to set:
      - my_webservice to either httpd or nginx
      - my_action to install or uninstall

      ❌                  ❌                  ❌                  ❌

- name: Run install tasks
  when: my_action == 'install'
  ansible.builtin.include_tasks: install.yml

- name: Run uninstall tasks
  when: my_action == 'uninstall'
  ansible.builtin.include_tasks: uninstall.yml
