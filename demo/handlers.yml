---
- name: Handler demonstration
  hosts: "{{ my_host | default('servera') }}"
  become: true
  force_handlers: true

  tasks:

    - name: Ensure needed content is present
      notify: Reboot server
      ansible.builtin.copy:
        content: Restart
        dest: /var/tmp/reboot

    - name: Ensure failure
      ignore_errors: true
      ansible.builtin.fail:

    - name: Ensure all notified handlers execute right now
      ansible.builtin.meta: flush_handlers

    - name: Ensure Hello, world is printed
      ansible.builtin.debug:
        msg: Hello, world

  handlers:

    - name: Ensure server is rebooted
      listen: Reboot server
      ansible.builtin.reboot:

    - name: Ensure that we can connect to server
      listen: Reboot server
      delegate_to: localhost
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname }}"
        port: 22
        delay: 5
        timeout: 20
