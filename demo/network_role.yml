---
- name: Setup networking
  hosts:
    - servera
    - serverb
  become: true

  vars:

    network_connections:
      - name: datacenter
        type: ethernet
        interface_name: eth1
        state: up
        ip:
          dhcp4: no
          address:
            - "{{ datacenter_ip }}/24"

  tasks:

    - name: Apply network configuration
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.network