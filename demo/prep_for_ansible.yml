---
- name: Bootstrap ansible user and privilege escalation
  hosts: "{{ my_host }}"
  become: true
  gather_facts: false

  vars:
    ansible_user_name: "{{ my_user | default('ansible') }}"
    ansible_user_pubkey: "{{ my_pubkey }}"

  tasks:
    - name: Ensure ansible user exists
      ansible.builtin.user:
        name: "{{ ansible_user_name }}"
        state: present
        create_home: true
        shell: /bin/bash

    - name: Ensure SSH public key is installed for ansible user
      ansible.posix.authorized_key:
        user: "{{ ansible_user_name }}"
        key: "{{ ansible_user_pubkey }}"
        state: present

    - name: Ensure sudoers drop-in file exists for ansible user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ ansible_user_name }}"
        content: "{{ ansible_user_name }} ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"
