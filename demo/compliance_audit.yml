---
- name: Compliance audit and remediation
  hosts: "{{ my_host | default('servera') }}"
  become: true
  gather_facts: true

  vars:

    my_min_password_length: 8
    my_max_password_days: 90
    my_ssh_permit_root: "no"
    my_ssh_protocol: 2
    my_world_writable_paths:
      - /tmp
      - /var/tmp

  tasks:

    - name: Audit password quality policy
      tags:
        - audit
        - remediate
      block:

        - name: Ensure password minlen is checked
          register: pam_minlen
          changed_when: false
          ansible.builtin.shell: >
            grep -E '^minlen' /etc/security/pwquality.conf
            | awk -F'=' '{print $2}'
            | tr -d ' '
          failed_when: false

        - name: Report password policy status
          tags:
            - audit
          ansible.builtin.debug:
            msg: >-
              Password minlen:
              {{ pam_minlen.stdout | default('not set') }}
              (required: {{ my_min_password_length }})
              -
              {{ 'PASS' if (pam_minlen.stdout | default('0') | int) >= my_min_password_length else 'FAIL' }}

    - name: Audit SSH hardening
      tags:
        - audit
        - remediate
      block:

        - name: Ensure sshd PermitRootLogin is checked
          register: ssh_root
          changed_when: false
          ansible.builtin.command: sshd -T
          failed_when: false

        - name: Report SSH root login status
          tags:
            - audit
          vars:
            permit_root_value: >-
              {{ ssh_root.stdout_lines
                 | select('match', '^permitrootlogin')
                 | first
                 | default('permitrootlogin unknown')
                 | split(' ')
                 | last }}
          ansible.builtin.debug:
            msg: >-
              SSH PermitRootLogin: {{ permit_root_value }}
              (required: {{ my_ssh_permit_root }})
              -
              {{ 'PASS' if permit_root_value == my_ssh_permit_root else 'FAIL' }}

    - name: Audit password aging policy
      tags:
        - audit
        - remediate
      block:

        - name: Ensure PASS_MAX_DAYS is checked
          register: pass_max
          changed_when: false
          ansible.builtin.shell: >
            grep '^PASS_MAX_DAYS' /etc/login.defs
            | awk '{print $2}'
          failed_when: false

        - name: Report password aging status
          tags:
            - audit
          ansible.builtin.debug:
            msg: >-
              PASS_MAX_DAYS: {{ pass_max.stdout | default('not set') }}
              (required: <= {{ my_max_password_days }})
              -
              {{ 'PASS' if (pass_max.stdout | default('99999') | int) <= my_max_password_days else 'FAIL' }}

    - name: Audit filesystem permissions
      tags:
        - audit
        - remediate
      block:

        - name: Ensure /tmp has sticky bit
          register: tmp_perms
          changed_when: false
          ansible.builtin.stat:
            path: /tmp

        - name: Report /tmp sticky bit status
          tags:
            - audit
          ansible.builtin.debug:
            msg: >-
              /tmp sticky bit:
              {{ 'PASS' if tmp_perms.stat.woth is defined and tmp_perms.stat.mode is defined and tmp_perms.stat.mode[-4] == '1' else 'FAIL' }}

        - name: Ensure world-writable files are found
          register: world_writable
          changed_when: false
          ansible.builtin.command: >
            find {{ my_world_writable_paths | join(' ') }}
            -xdev -type f -perm -0002
            -not -path '*/proc/*'
          failed_when: false

        - name: Report world-writable file count
          tags:
            - audit
          ansible.builtin.debug:
            msg: >-
              World-writable files:
              {{ world_writable.stdout_lines | default([]) | length }}
              -
              {{ 'PASS' if (world_writable.stdout_lines | default([]) | length) == 0 else 'FAIL' }}

    - name: Audit unnecessary services
      tags:
        - audit
      block:

        - name: Ensure running services are listed
          register: running_services
          changed_when: false
          ansible.builtin.shell: >
            systemctl list-units --type=service --state=running --no-pager
            --no-legend | awk '{print $1}'

        - name: Report running service count
          ansible.builtin.debug:
            msg: "Running services: {{ running_services.stdout_lines | length }}"

    - name: Remediate password quality
      tags:
        - remediate
        - never
      block:

        - name: Ensure password minlen is set
          ansible.builtin.lineinfile:
            path: /etc/security/pwquality.conf
            regexp: '^#?\s*minlen'
            line: "minlen = {{ my_min_password_length }}"

    - name: Remediate password aging
      tags:
        - remediate
        - never
      block:

        - name: Ensure PASS_MAX_DAYS is set
          ansible.builtin.lineinfile:
            path: /etc/login.defs
            regexp: '^PASS_MAX_DAYS'
            line: "PASS_MAX_DAYS\t{{ my_max_password_days }}"
