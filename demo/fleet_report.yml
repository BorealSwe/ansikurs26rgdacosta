---
- name: Fleet inventory report
  hosts: "{{ my_host | default('all') }}"
  become: true
  gather_facts: true

  vars:

    my_report_dest: ./fleet_report_{{ ansible_date_time.date | default('unknown') }}.txt

  tasks:

    - name: Ensure package count is gathered
      register: pkg_count
      changed_when: false
      ansible.builtin.shell: rpm -qa | wc -l

    - name: Ensure uptime in days is calculated
      register: uptime_days
      changed_when: false
      ansible.builtin.shell: awk '{print int($1/86400)}' /proc/uptime

    - name: Ensure kernel needs-restarting status is checked
      register: needs_restart
      changed_when: false
      failed_when: false
      ansible.builtin.command: /usr/bin/dnf needs-restarting -r

    - name: Report host inventory
      ansible.builtin.debug:
        msg: |
          === {{ inventory_hostname }} ===
          OS            : {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          Kernel        : {{ ansible_facts['kernel'] }}
          Architecture  : {{ ansible_facts['architecture'] }}
          CPUs          : {{ ansible_facts['processor_vcpus'] }}
          Memory        : {{ ansible_facts['memtotal_mb'] }} MB
          Swap          : {{ ansible_facts['swaptotal_mb'] }} MB
          Root disk free: {{ (ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | first).size_available | human_readable }}
          Uptime        : {{ uptime_days.stdout }} days
          Packages      : {{ pkg_count.stdout }}
          Reboot needed : {{ 'Yes' if needs_restart.rc | default(0) == 1 else 'No' }}
          IPv4 address  : {{ ansible_facts['default_ipv4']['address'] | default('N/A') }}
          FQDN          : {{ ansible_facts['fqdn'] }}

    - name: Ensure report is saved to controller
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.template:
        src: /dev/stdin
        dest: "{{ my_report_dest }}"
        mode: "0644"
      vars:
        report_content: |
          Fleet Inventory Report - {{ ansible_date_time.date | default('unknown') }}
          ================================================
          {% for host in ansible_play_hosts %}
          {{ host }}: {{ hostvars[host]['ansible_facts']['distribution'] | default('Unknown') }} {{ hostvars[host]['ansible_facts']['distribution_version'] | default('') }} | Kernel: {{ hostvars[host]['ansible_facts']['kernel'] | default('Unknown') }} | CPUs: {{ hostvars[host]['ansible_facts']['processor_vcpus'] | default('?') }} | RAM: {{ hostvars[host]['ansible_facts']['memtotal_mb'] | default('?') }}MB | Uptime: {{ hostvars[host]['uptime_days']['stdout'] | default('?') }}d | Pkgs: {{ hostvars[host]['pkg_count']['stdout'] | default('?') }}
          {% endfor %}
      changed_when: false
      failed_when: false
