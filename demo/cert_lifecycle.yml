---
- name: Certificate lifecycle management
  hosts: "{{ my_host | default('servera') }}"
  become: true
  gather_facts: true
  force_handlers: true

  vars:

    my_cert_paths:
      - /etc/pki/tls/certs
    my_expiry_days: 30
    my_cert_cn: "{{ inventory_hostname }}"
    my_cert_dest: /etc/pki/tls/certs/{{ inventory_hostname }}.crt
    my_key_dest: /etc/pki/tls/private/{{ inventory_hostname }}.key

  tasks:

    - name: Scan for certificates expiring soon
      tags:
        - scan
        - always
      block:

        - name: Ensure certificate files are found
          register: cert_files
          ansible.builtin.find:
            paths: "{{ my_cert_paths }}"
            patterns: '*.crt,*.pem'
            recurse: true

        - name: Ensure certificate details are gathered
          register: cert_info
          loop: "{{ cert_files.files }}"
          loop_control:
            label: "{{ item.path }}"
          failed_when: false
          community.crypto.x509_certificate_info:
            path: "{{ item.path }}"

        - name: Report certificate status
          loop: "{{ cert_info.results }}"
          loop_control:
            label: "{{ item.item.path }}"
          when: item.not_after is defined
          vars:
            my_seconds_remaining: "{{ (item.not_after | to_datetime('%Y%m%d%H%M%SZ') - ansible_date_time.iso8601 | to_datetime('%Y-%m-%dT%H:%M:%SZ')).total_seconds() }}"
            my_days_remaining: "{{ (my_seconds_remaining | int // 86400) }}"
          ansible.builtin.debug:
            msg: >-
              {{ item.item.path }}:
              {{ 'EXPIRING SOON' if (my_days_remaining | int) < my_expiry_days else 'OK' }}
              — expires {{ item.not_after }}
              ({{ my_days_remaining }} days remaining)
              — subject: {{ item.subject.commonName | default('unknown') }}

    - name: Renew certificates
      tags:
        - renew
        - never
      block:

        - name: Ensure private key is generated
          community.crypto.openssl_privatekey:
            path: "{{ my_key_dest }}"
            size: 2048
            mode: "0600"
            owner: root
            group: root

        - name: Ensure self-signed certificate is generated
          notify: Ensure dependent services are restarted
          community.crypto.x509_certificate:
            path: "{{ my_cert_dest }}"
            privatekey_path: "{{ my_key_dest }}"
            provider: selfsigned
            selfsigned_not_after: "+365d"
            mode: "0644"
            owner: root
            group: root

      rescue:

        - name: Report certificate renewal failure
          ansible.builtin.debug:
            msg: "Certificate renewal failed for {{ inventory_hostname }}"

  handlers:

    - name: Ensure dependent services are restarted
      ansible.builtin.service:
        name: "{{ item }}"
        state: restarted
      loop:
        - httpd
      failed_when: false
