---
- name: Manage LVM
  hosts: "{{ my_host | default('rhel') }}"
  become: true
  gather_facts: true

  vars:

    my_disks:
      - /dev/sdb
    my_vg: vg_db
    my_lv: lv_mysql
    my_dev: /dev/{{ my_vg }}/{{ my_lv }}
    my_mount: /var/lib/mysql
    my_size: 512
    my_fs: ext4

  tasks:

    - name: Ensure VG exists with PVs defined
      ansible.builtin.lvg:
        vg: "{{ my_vg }}"
        pvs: "{{ my_disks }}"

    - name: Ensure LV exists
      ansible.builtin.lvol:
        vg: "{{ my_vg }}"
        lv: "{{ my_lv }}"
        size: "{{ my_size | int }}"

    - name: Ensure Filesystem exists
      ansible.builtin.filesystem:
        fstype: "{{ my_fs }}"
        dev: "{{ my_dev }}"

    - name: Ensure mountpoint exists
      ansible.builtin.file:
        path: "{{ my_mount }}"
        state: directory

    - name: Ensure LV is mounted
      ansible.builtin.mount:
        path: "{{ my_mount }}"
        src: "{{ my_dev }}"
        fstype: "{{ my_fs }}"
        state: mounted



