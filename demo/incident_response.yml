---
- name: Incident response evidence collection
  hosts: "{{ my_host | mandatory('You must specify the target host with -e my_host=<hostname>') }}"
  become: true
  gather_facts: true

  vars:

    my_sos_plugins: process,networking,login,cron,selinux,auditd,filesys
    my_fetch_dest: ./incident_evidence/

  tasks:

    - name: Ensure sos report collects system evidence
      register: sos_output
      changed_when: false
      ansible.builtin.command: >
        sos report --batch
        --only-plugins={{ my_sos_plugins }}
        --tmp-dir=/var/tmp

    - name: Ensure sos archive path is extracted
      ansible.builtin.set_fact:
        my_sos_archive: "{{ sos_output.stdout | regex_search('/var/tmp/sosreport-[\\w.-]+\\.tar\\.xz') }}"

    - name: Ensure sos archive is fetched to controller
      tags:
        - fetch
      ansible.builtin.fetch:
        src: "{{ my_sos_archive }}"
        dest: "{{ my_fetch_dest }}"
        flat: false

    - name: Report evidence collection summary
      ansible.builtin.debug:
        msg: >-
          Evidence collected from {{ inventory_hostname }}
          via sos report (plugins: {{ my_sos_plugins }}).
          Archive: {{ my_sos_archive }}.
          Fetched to controller at {{ my_fetch_dest }}.

    - name: Isolate host
      tags:
        - isolate
        - never
      block:

        - name: Ensure running services are gathered
          ansible.builtin.service_facts:

        - name: Ensure non-essential services are identified
          vars:
            my_essential_services:
              - sshd
              - auditd
              - dbus
              - NetworkManager
              - chronyd
              - systemd-journald
              - systemd-logind
          ansible.builtin.set_fact:
            my_nonessential_services: >-
              {{ ansible_facts.services
                 | dict2items
                 | selectattr('value.state', 'equalto', 'running')
                 | selectattr('value.name', 'defined')
                 | rejectattr('value.name', 'in', my_essential_services)
                 | map(attribute='value.name')
                 | list }}

        - name: Report isolation candidates
          ansible.builtin.debug:
            msg: >-
              Services that would be stopped during isolation:
              {{ my_nonessential_services | join(', ') }}
