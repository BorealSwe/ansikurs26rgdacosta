---
- name: Manage Software
  hosts: "{{ my_host | default('all') }}"
  gather_facts: true

  tasks:

    - name: Ensure {{ my_package | default('bash') }} is at state {{ my_state | default('present') }}
      become: true
      ansible.builtin.dnf:
        name: "{{ my_package | default('bash') }}"
        state: "{{ my_state | default('present') }}"
