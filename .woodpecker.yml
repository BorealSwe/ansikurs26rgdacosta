---
# Woodpecker CI Pipeline for Execution Environment Automation
# Runs on belfast.zero-effort.net with privileged container builds

# Only run on master branch (push or manual)
when:
  - event: push
    branch: master
    path:
      include:
        - execution_environments/custom-ee/**
  - event: manual
    branch: master

# Skip submodules during clone
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: false

steps:
  # Validate EE definition before building
  validate:
    image: quay.io/ansible/ansible-builder:latest
    commands:
      - cd execution_environments/custom-ee
      - ansible-builder create --verbosity 2
      - echo "✅ EE definition is valid"

  # Build the EE image with podman
  build:
    image: registry.access.redhat.com/ubi9/ubi:latest
    privileged: true
    environment:
      RH_USER:
        from_secret: rh_registry_username
      RH_PASS:
        from_secret: rh_registry_password
    dns:
      - 8.8.8.8
      - 1.1.1.1
    commands:
      # Disable all non-UBI repos (satellite repos are being injected by host)
      - sed -i 's/^enabled=1/enabled=0/' /etc/yum.repos.d/redhat.repo || true
      - rm -f /etc/yum.repos.d/redhat.repo
      - dnf clean all
      # Install all required tools (only from UBI repos)
      - dnf install -y --disablerepo='*' --enablerepo='ubi-*' ansible-core podman python3-pip
      - pip3 install ansible-builder
      # Configure podman DNS for nested builds
      - mkdir -p /etc/containers
      - echo '[network]' > /etc/containers/containers.conf
      - echo 'dns_servers = ["8.8.8.8", "1.1.1.1"]' >> /etc/containers/containers.conf
      # Login to Red Hat registry to pull base image
      - echo "RH_USER is set:" && test -n "$RH_USER" && echo "YES" || echo "NO"
      - echo "$RH_PASS" | podman login -u "$RH_USER" --password-stdin registry.redhat.io
      # Build the EE
      - cd execution_environments/custom-ee
      - echo "Building EE image with ansible-builder..."
      - |
        ansible-builder build \
          --tag quay.io/rdacosta/custom-ee:${CI_COMMIT_SHA:0:8} \
          --tag quay.io/rdacosta/custom-ee:latest \
          --container-runtime podman \
          --verbosity 3
    depends_on:
      - validate

  # Smoke test the built EE
  test:
    image: quay.io/rdacosta/custom-ee:${CI_COMMIT_SHA:0:8}
    commands:
      - ansible --version
      - ansible-galaxy collection list
      - python3 -c "import jmespath, requests; print('✅ Python deps OK')"
    depends_on:
      - build

  # Push to Quay.io
  publish:
    image: quay.io/podman/stable
    environment:
      QUAY_USER:
        from_secret: quay_username
      QUAY_PASS:
        from_secret: quay_password
    commands:
      - echo "$QUAY_PASS" | podman login -u "$QUAY_USER" --password-stdin quay.io
      - podman push quay.io/rdacosta/custom-ee:${CI_COMMIT_SHA:0:8}
      - podman push quay.io/rdacosta/custom-ee:latest
      - echo "✅ Published to quay.io/rdacosta/custom-ee:${CI_COMMIT_SHA:0:8}"
    depends_on:
      - test
    when:
      - event: push
        branch: master
