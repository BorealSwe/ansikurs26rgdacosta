---
# Woodpecker CI Pipeline for Execution Environment Automation
# Runs on belfast.zero-effort.net with privileged container builds

# Only run on master branch (push or manual)
when:
  - event: push
    branch: master
    path:
      include:
        - execution_environments/custom-ee/**
  - event: manual
    branch: master

# Skip submodules during clone
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: false

steps:
  # Validate EE definition before building
  validate:
    image: quay.io/ansible/ansible-builder:latest
    commands:
      - cd execution_environments/custom-ee
      - ansible-builder create --verbosity 2
      - echo "✅ EE definition is valid"

  # Build the EE image using manual two-step process with host networking
  build:
    image: quay.io/ansible/ansible-builder:latest
    privileged: true
    environment:
      RH_USER:
        from_secret: rh_registry_username
      RH_PASS:
        from_secret: rh_registry_password
    commands:
      # Authenticate to Red Hat registry
      - echo "$RH_PASS" | podman login -u "$RH_USER" --password-stdin registry.redhat.io
      # Two-step process: create build context, then build with host networking
      - cd execution_environments/custom-ee
      - ansible-builder create --verbosity 3
      - podman build --network=host -f context/Containerfile -t quay.io/rdacosta/custom-ee:${CI_COMMIT_SHA:0:8} -t quay.io/rdacosta/custom-ee:latest context
    depends_on:
      - validate

  # Smoke test the built EE
  test:
    image: quay.io/rdacosta/custom-ee:${CI_COMMIT_SHA:0:8}
    commands:
      - ansible --version
      - ansible-galaxy collection list
      - python3 -c "import jmespath, requests; print('✅ Python deps OK')"
    depends_on:
      - build

  # Push to Quay.io
  publish:
    image: quay.io/podman/stable
    environment:
      QUAY_USER:
        from_secret: quay_username
      QUAY_PASS:
        from_secret: quay_password
    commands:
      - echo "$QUAY_PASS" | podman login -u "$QUAY_USER" --password-stdin quay.io
      - podman push quay.io/rdacosta/custom-ee:${CI_COMMIT_SHA:0:8}
      - podman push quay.io/rdacosta/custom-ee:latest
      - echo "✅ Published to quay.io/rdacosta/custom-ee:${CI_COMMIT_SHA:0:8}"
    depends_on:
      - test
    when:
      - event: push
        branch: master
