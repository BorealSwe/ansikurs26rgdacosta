---
# Woodpecker CI Pipeline for Execution Environment Automation
# Runs on belfast.zero-effort.net with privileged container builds

variables:
  - &ee_dir execution_environments/custom-ee
  - &pipeline_dir execution_environments/pipeline
  - &quay_org rgdacosta

when:
  - event: push
    branch: master
    path:
      include:
        - execution_environments/custom-ee/**
  - event: manual

steps:
  # Validate EE definition before building
  validate:
    image: quay.io/ansible/ansible-builder:latest
    commands:
      - cd *ee_dir
      - ansible-builder create --verbosity 2
      - echo "✅ EE definition is valid"

  # Build the EE image with podman
  build:
    image: quay.io/ansible/ansible-builder:latest
    commands:
      - cd *ee_dir
      - echo "Building EE image with ansible-builder..."
      - |
        ansible-builder build \
          --tag quay.io/*quay_org/custom-ee:${CI_COMMIT_SHA:0:8} \
          --tag quay.io/*quay_org/custom-ee:latest \
          --container-runtime podman \
          --verbosity 3
    depends_on:
      - validate

  # Smoke test the built EE
  test:
    image: quay.io/*quay_org/custom-ee:${CI_COMMIT_SHA:0:8}
    commands:
      - ansible --version
      - ansible-galaxy collection list
      - python3 -c "import jmespath, requests; print('✅ Python deps OK')"
    depends_on:
      - build

  # Push to Quay.io
  publish:
    image: quay.io/podman/stable
    secrets:
      - quay_username
      - quay_password
    commands:
      - echo "$QUAY_PASSWORD" | podman login -u "$QUAY_USERNAME" --password-stdin quay.io
      - podman push quay.io/*quay_org/custom-ee:${CI_COMMIT_SHA:0:8}
      - podman push quay.io/*quay_org/custom-ee:latest
      - echo "✅ Published to quay.io/*quay_org/custom-ee:${CI_COMMIT_SHA:0:8}"
    depends_on:
      - test
    when:
      - event: push
        branch: master
