- name: Configure login banners
  hosts: "{{ my_host }}"
  gather_facts: false

  tasks:

    - name: Manage login banner on IOS devices
      notify: Ensure changes are saved
      cisco.ios.ios_banner:
        banner: login
        text: "{{ my_banner | default('WARNING: Local changes are subject to being replaced by Ansible Automation') }}"
        state: "{{ my_state | default('present') }}"

  handlers:

    - name: Ensure changes are saved
      cisco.ios.ios_config:
        save_when: always
