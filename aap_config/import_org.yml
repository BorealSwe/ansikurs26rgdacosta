---
- name: Import AAP Controller organization resources
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    controller_api: "{{ controller_host }}/api/controller/v2"
    source_dir: "{{ playbook_dir }}/export/{{ org_name | lower }}"
    target_org: "{{ import_org_name | default('Linux') }}"

  tasks:

    # ── Load exported data ───────────────────────────────────────

    - name: Exported organization data is loaded
      ansible.builtin.set_fact:
        exp_org: "{{ lookup('file', source_dir + '/organization.yml') | from_yaml }}"
        exp_creds: "{{ lookup('file', source_dir + '/credentials/all.yml') | from_yaml }}"
        exp_inventories: "{{ lookup('file', source_dir + '/inventories/inventories.yml') | from_yaml }}"
        exp_hosts: "{{ lookup('file', source_dir + '/inventories/hosts.yml') | from_yaml }}"
        exp_groups: "{{ lookup('file', source_dir + '/inventories/groups.yml') | from_yaml }}"
        exp_projects: "{{ lookup('file', source_dir + '/projects/all.yml') | from_yaml }}"
        exp_jts: "{{ lookup('file', source_dir + '/job_templates/all.yml') | from_yaml }}"
        exp_jt_surveys: "{{ lookup('file', source_dir + '/job_templates/surveys.yml') | from_yaml | default([], true) }}"
        exp_wfts: "{{ lookup('file', source_dir + '/workflow_templates/all.yml') | from_yaml }}"
        exp_wft_surveys: "{{ lookup('file', source_dir + '/workflow_templates/surveys.yml') | from_yaml | default([], true) }}"
        exp_notifs: "{{ lookup('file', source_dir + '/notification_templates/all.yml') | from_yaml }}"
        exp_notif_assocs: "{{ lookup('file', source_dir + '/notification_templates/associations.yml') | from_yaml | default([], true) }}"
        exp_users: "{{ lookup('file', source_dir + '/users/all.yml') | from_yaml | default([], true) }}"
        exp_teams: "{{ lookup('file', source_dir + '/teams/all.yml') | from_yaml | default([], true) }}"
        exp_roles: "{{ lookup('file', source_dir + '/roles/all.yml') | from_yaml | default([], true) }}"
        exp_schedules: "{{ lookup('file', source_dir + '/schedules/all.yml') | from_yaml | default([], true) }}"

    # ── Delete default AAP resources ────────────────────────────

    - name: Default resources are identified
      ansible.builtin.uri:
        url: "{{ controller_api }}/{{ item.endpoint }}/?name={{ item.name | urlencode }}"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      loop:
        - { name: "Demo Job Template", endpoint: "job_templates" }
        - { name: "Demo Project", endpoint: "projects" }
        - { name: "Demo Credential", endpoint: "credentials" }
        - { name: "Demo Inventory", endpoint: "inventories" }
      loop_control:
        label: "{{ item.name }}"
      register: default_lookup

    - name: Default resources are absent
      ansible.builtin.uri:
        url: "{{ controller_api }}/{{ item.item.endpoint }}/{{ item.json.results[0].id }}/"
        method: DELETE
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        status_code: [202, 204]
      loop: "{{ default_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.json.count > 0

    # ── Organization ─────────────────────────────────────────────

    - name: Target organization is present
      ansible.builtin.uri:
        url: "{{ controller_api }}/organizations/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ target_org }}"
          description: "Imported from {{ org_name }} organization"
        status_code: [201]
      register: org_create

    - name: Target organization ID is set
      ansible.builtin.set_fact:
        target_org_id: "{{ org_create.json.id }}"

    # ── Galaxy Credential Association ────────────────────────────

    - name: Ansible Galaxy credential is identified
      ansible.builtin.uri:
        url: "{{ controller_api }}/credentials/?name={{ 'Ansible Galaxy' | urlencode }}&managed=true"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      register: galaxy_cred

    - name: Galaxy credential is associated with organization
      ansible.builtin.uri:
        url: "{{ controller_api }}/organizations/{{ target_org_id }}/galaxy_credentials/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body: "{{ {'id': (galaxy_cred.json.results[0].id | int)} | to_json }}"
        status_code: [204]
      when: galaxy_cred.json.count > 0

    # ── Users ────────────────────────────────────────────────────

    - name: Users are present
      ansible.builtin.uri:
        url: "{{ controller_api }}/users/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          username: "{{ item.username }}"
          first_name: "{{ item.first_name | default('') }}"
          last_name: "{{ item.last_name | default('') }}"
          email: "{{ item.email | default('') }}"
          password: "redhat"
          is_superuser: "{{ item.is_superuser | default(false) }}"
        status_code: [201, 400]
      loop: "{{ exp_users }}"
      loop_control:
        label: "{{ item.username }}"
      register: user_results

    - name: User IDs are retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/users/?username={{ item.username | urlencode }}"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      loop: "{{ exp_users }}"
      loop_control:
        label: "{{ item.username }}"
      register: user_lookup_results

    - name: User name map is built
      ansible.builtin.set_fact:
        user_map: "{{ user_map | default({}) | combine({item.item.username: item.json.results[0].id}) }}"
      loop: "{{ user_lookup_results.results }}"
      loop_control:
        label: "{{ item.item.username }}"

    # ── Teams ────────────────────────────────────────────────────

    - name: Teams are present
      ansible.builtin.uri:
        url: "{{ controller_api }}/teams/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description | default('') }}"
          organization: "{{ target_org_id }}"
        status_code: [201]
      loop: "{{ exp_teams }}"
      loop_control:
        label: "{{ item.name }}"
      register: team_results

    - name: Team name map is built
      ansible.builtin.set_fact:
        team_map: "{{ team_map | default({}) | combine({item.item.name: item.json.id}) }}"
      loop: "{{ team_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Users are added to teams
      ansible.builtin.uri:
        url: "{{ controller_api }}/teams/{{ team_map[item.0.name] }}/users/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body: "{{ {'id': (user_map[item.1] | int)} | to_json }}"
        status_code: [204]
      loop: "{{ exp_teams | subelements('members', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.name }} <- {{ item.1 }}"

    # ── Organization Roles ───────────────────────────────────────

    - name: Target organization roles are retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/organizations/{{ target_org_id }}/object_roles/?page_size=100"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      register: target_org_roles

    - name: Target org role map is built
      ansible.builtin.set_fact:
        target_role_map: "{{ target_role_map | default({}) | combine({item.name: item.id}) }}"
      loop: "{{ target_org_roles.json.results }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Users are assigned to organization roles
      ansible.builtin.uri:
        url: "{{ controller_api }}/roles/{{ target_role_map[item.0.role_name] }}/users/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body: "{{ {'id': (user_map[item.1] | int)} | to_json }}"
        status_code: [204]
      loop: "{{ exp_roles | subelements('users') }}"
      loop_control:
        label: "{{ item.0.role_name }} <- {{ item.1 }}"
      when: item.0.role_name in target_role_map

    # ── Credentials ──────────────────────────────────────────────

    - name: Credential type IDs are retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/credential_types/?name={{ item | urlencode }}"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      loop: "{{ exp_creds | map(attribute='credential_type') | unique | list }}"
      register: cred_type_results

    - name: Credential type map is built
      ansible.builtin.set_fact:
        cred_type_map: "{{ cred_type_map | default({}) | combine({item.item: item.json.results[0].id}) }}"
      loop: "{{ cred_type_results.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Credentials are present
      ansible.builtin.uri:
        url: "{{ controller_api }}/credentials/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
          organization: "{{ target_org_id }}"
          credential_type: "{{ cred_type_map[item.credential_type] }}"
          inputs: >-
            {{ item.inputs
               | combine({'ssh_key_data': lookup('file', ssh_key_file)})
               | dict2items
               | rejectattr('value', 'equalto', '$encrypted$')
               | list
               | items2dict }}
        status_code: [201]
      loop: "{{ exp_creds }}"
      loop_control:
        label: "{{ item.name }}"
      register: cred_results

    - name: Credential name map is built
      ansible.builtin.set_fact:
        cred_map: "{{ cred_map | default({}) | combine({item.item.name: item.json.id}) }}"
      loop: "{{ cred_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    # ── Inventories ──────────────────────────────────────────────

    - name: Inventories are present
      ansible.builtin.uri:
        url: "{{ controller_api }}/inventories/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
          organization: "{{ target_org_id }}"
        status_code: [201]
      loop: "{{ exp_inventories }}"
      loop_control:
        label: "{{ item.name }}"
      register: inv_results

    - name: Inventory name map is built
      ansible.builtin.set_fact:
        inv_map: "{{ inv_map | default({}) | combine({item.item.name: item.json.id}) }}"
      loop: "{{ inv_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    # ── Hosts ────────────────────────────────────────────────────

    - name: Hosts are present
      ansible.builtin.uri:
        url: "{{ controller_api }}/hosts/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
          inventory: "{{ inv_map[item.inventory] }}"
          enabled: "{{ item.enabled }}"
        status_code: [201]
      loop: "{{ exp_hosts }}"
      loop_control:
        label: "{{ item.name }}"
      register: host_results

    - name: Host name map is built
      ansible.builtin.set_fact:
        host_map: "{{ host_map | default({}) | combine({item.item.name: item.json.id}) }}"
      loop: "{{ host_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    # ── Groups ───────────────────────────────────────────────────

    - name: Groups are present
      ansible.builtin.uri:
        url: "{{ controller_api }}/groups/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
          inventory: "{{ inv_map[item.inventory] }}"
        status_code: [201]
      loop: "{{ exp_groups }}"
      loop_control:
        label: "{{ item.name }}"
      register: group_results

    - name: Group name map is built
      ansible.builtin.set_fact:
        group_map: "{{ group_map | default({}) | combine({item.item.name: item.json.id}) }}"
      loop: "{{ group_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Hosts are added to groups
      ansible.builtin.uri:
        url: "{{ controller_api }}/groups/{{ group_map[item.0.name] }}/hosts/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body: "{{ {'id': (host_map[item.1] | int)} | to_json }}"
        status_code: [204]
      loop: "{{ exp_groups | subelements('hosts', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.name }} <- {{ item.1 }}"

    # ── Projects ─────────────────────────────────────────────────

    - name: Projects are present
      ansible.builtin.uri:
        url: "{{ controller_api }}/projects/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
          organization: "{{ target_org_id }}"
          scm_type: "{{ item.scm_type }}"
          scm_url: "{{ item.scm_url }}"
          scm_branch: "{{ item.scm_branch }}"
          scm_clean: "{{ item.scm_clean }}"
          scm_delete_on_update: "{{ item.scm_delete_on_update }}"
          scm_update_on_launch: "{{ item.scm_update_on_launch }}"
        status_code: [201]
      loop: "{{ exp_projects }}"
      loop_control:
        label: "{{ item.name }}"
      register: proj_results

    - name: Project name map is built
      ansible.builtin.set_fact:
        project_map: "{{ project_map | default({}) | combine({item.item.name: item.json.id}) }}"
      loop: "{{ proj_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Project sync is complete
      ansible.builtin.uri:
        url: "{{ controller_api }}/projects/{{ project_map[item.name] }}/"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      register: project_sync
      until: project_sync.json.status in ['successful', 'failed', 'error', 'canceled']
      retries: 30
      delay: 10
      loop: "{{ exp_projects }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Project sync is verified
      ansible.builtin.fail:
        msg: "Project '{{ item.item.name }}' sync failed with status: {{ item.json.status }}"
      loop: "{{ project_sync.results }}"
      when: item.json.status != 'successful'
      loop_control:
        label: "{{ item.item.name }}"

    # ── Job Templates ────────────────────────────────────────────

    - name: Job templates are present
      ansible.builtin.uri:
        url: "{{ controller_api }}/job_templates/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
          organization: "{{ target_org_id }}"
          job_type: "{{ item.job_type }}"
          playbook: "{{ item.playbook }}"
          inventory: "{{ inv_map[item.inventory] }}"
          project: "{{ project_map[item.project] }}"
          become_enabled: "{{ item.become_enabled }}"
          forks: "{{ item.forks }}"
          verbosity: "{{ item.verbosity }}"
          diff_mode: "{{ item.diff_mode }}"
          extra_vars: "{{ item.extra_vars | default('') }}"
          limit: "{{ item.limit | default('') }}"
          job_tags: "{{ item.job_tags | default('') }}"
          skip_tags: "{{ item.skip_tags | default('') }}"
          survey_enabled: "{{ item.survey_enabled | default(false) }}"
        status_code: [201]
      loop: "{{ exp_jts }}"
      loop_control:
        label: "{{ item.name }}"
      register: jt_results

    - name: Job template name map is built
      ansible.builtin.set_fact:
        jt_map: "{{ jt_map | default({}) | combine({item.item.name: item.json.id}) }}"
      loop: "{{ jt_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Credentials are associated with job templates
      ansible.builtin.uri:
        url: "{{ controller_api }}/job_templates/{{ jt_map[item.0.name] }}/credentials/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body: "{{ {'id': (cred_map[item.1] | int)} | to_json }}"
        status_code: [204]
      loop: "{{ exp_jts | subelements('credentials') }}"
      loop_control:
        label: "{{ item.0.name }} <- {{ item.1 }}"

    # ── Job Template Surveys ─────────────────────────────────────

    - name: Job template survey specs are imported
      ansible.builtin.uri:
        url: "{{ controller_api }}/job_templates/{{ jt_map[item.job_template] }}/survey_spec/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body: "{{ item.survey_spec }}"
        status_code: [200]
      loop: "{{ exp_jt_surveys }}"
      loop_control:
        label: "{{ item.job_template }}"

    # ── Job Template Schedules ───────────────────────────────────

    - name: Schedules are imported
      ansible.builtin.uri:
        url: "{{ controller_api }}/job_templates/{{ jt_map[item.job_template] }}/schedules/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description | default('') }}"
          rrule: "{{ item.rrule }}"
          enabled: "{{ item.enabled }}"
        status_code: [201]
      loop: "{{ exp_schedules }}"
      loop_control:
        label: "{{ item.name }}"

    # ── Workflow Templates ───────────────────────────────────────

    - name: Unified job template map is built
      ansible.builtin.set_fact:
        ujt_map: "{{ jt_map | combine(project_map) }}"

    - name: Workflow templates are present
      ansible.builtin.uri:
        url: "{{ controller_api }}/workflow_job_templates/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
          organization: "{{ target_org_id }}"
          survey_enabled: "{{ item.survey_enabled }}"
          allow_simultaneous: "{{ item.allow_simultaneous }}"
          extra_vars: "{{ item.extra_vars | default('') }}"
        status_code: [201]
      loop: "{{ exp_wfts }}"
      loop_control:
        label: "{{ item.name }}"
      register: wft_results

    - name: Workflow template name map is built
      ansible.builtin.set_fact:
        wft_map: "{{ wft_map | default({}) | combine({item.item.name: item.json.id}) }}"
      loop: "{{ wft_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    # ── Workflow Nodes ───────────────────────────────────────────

    - name: Regular workflow nodes are present
      ansible.builtin.uri:
        url: "{{ controller_api }}/workflow_job_templates/{{ wft_map[item.0.name] }}/workflow_nodes/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          unified_job_template: "{{ ujt_map[item.1.unified_job_template] }}"
          all_parents_must_converge: "{{ item.1.all_parents_must_converge }}"
        status_code: [201]
      loop: "{{ exp_wfts | subelements('nodes') }}"
      when: item.1.unified_job_type != 'workflow_approval'
      loop_control:
        label: "{{ item.1.unified_job_template }}"
      register: regular_node_results

    - name: Approval workflow nodes are present
      ansible.builtin.uri:
        url: "{{ controller_api }}/workflow_job_templates/{{ wft_map[item.0.name] }}/workflow_nodes/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          all_parents_must_converge: "{{ item.1.all_parents_must_converge }}"
        status_code: [201]
      loop: "{{ exp_wfts | subelements('nodes') }}"
      when: item.1.unified_job_type == 'workflow_approval'
      loop_control:
        label: "{{ item.1.unified_job_template }}"
      register: approval_node_results

    - name: Approval templates are present on approval nodes
      ansible.builtin.uri:
        url: "{{ controller_api }}/workflow_job_template_nodes/{{ item.json.id }}/create_approval_template/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ item.item.1.unified_job_template }}"
          description: ""
          timeout: 0
        status_code: [201]
      loop: "{{ approval_node_results.results | selectattr('json', 'defined') | list }}"
      loop_control:
        label: "{{ item.item.1.unified_job_template }}"

    - name: Node ID map is built
      ansible.builtin.set_fact:
        node_id_map: "{{ node_id_map | default({}) | combine({(item.item.1.id | string): item.json.id}) }}"
      loop: "{{ (regular_node_results.results + approval_node_results.results) | selectattr('json', 'defined') | list }}"
      loop_control:
        label: "{{ item.item.1.unified_job_template }}"

    # ── Workflow Edges ───────────────────────────────────────────

    - name: Workflow edge operations are built
      ansible.builtin.set_fact:
        edge_ops: "{{ _edges | from_yaml | default([]) }}"
      vars:
        _edges: |
          {% for wf in exp_wfts %}
          {% for n in wf.nodes %}
          {% for t in n.success_nodes %}
          - source: {{ n.id }}
            target: {{ t }}
            type: success_nodes
          {% endfor %}
          {% for t in n.failure_nodes %}
          - source: {{ n.id }}
            target: {{ t }}
            type: failure_nodes
          {% endfor %}
          {% for t in n.always_nodes %}
          - source: {{ n.id }}
            target: {{ t }}
            type: always_nodes
          {% endfor %}
          {% endfor %}
          {% endfor %}

    - name: Workflow edges are wired
      ansible.builtin.uri:
        url: "{{ controller_api }}/workflow_job_template_nodes/{{ node_id_map[item.source | string] }}/{{ item.type }}/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body: "{{ {'id': (node_id_map[item.target | string] | int)} | to_json }}"
        status_code: [204]
      loop: "{{ edge_ops }}"
      loop_control:
        label: "{{ item.source }} --{{ item.type }}--> {{ item.target }}"

    # ── Workflow Template Surveys ────────────────────────────────

    - name: Workflow template survey specs are imported
      ansible.builtin.uri:
        url: "{{ controller_api }}/workflow_job_templates/{{ wft_map[item.workflow_template] }}/survey_spec/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body: "{{ item.survey_spec }}"
        status_code: [200]
      loop: "{{ exp_wft_surveys }}"
      loop_control:
        label: "{{ item.workflow_template }}"

    # ── Notification Templates ───────────────────────────────────

    - name: Notification templates are present
      ansible.builtin.uri:
        url: "{{ controller_api }}/notification_templates/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
          organization: "{{ target_org_id }}"
          notification_type: "{{ item.notification_type }}"
          notification_configuration: "{{ item.notification_configuration }}"
        status_code: [201]
      loop: "{{ exp_notifs }}"
      loop_control:
        label: "{{ item.name }}"
      register: notif_results

    - name: Notification template name map is built
      ansible.builtin.set_fact:
        notif_map: "{{ notif_map | default({}) | combine({item.item.name: item.json.id}) }}"
      loop: "{{ notif_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Started notifications are associated with workflow templates
      ansible.builtin.uri:
        url: "{{ controller_api }}/workflow_job_templates/{{ wft_map[item.0.workflow_template] }}/notification_templates_started/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body: "{{ {'id': (notif_map[item.1] | int)} | to_json }}"
        status_code: [204]
      loop: "{{ exp_notif_assocs | subelements('started_notifications', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.workflow_template }} started <- {{ item.1 }}"

    - name: Success notifications are associated with workflow templates
      ansible.builtin.uri:
        url: "{{ controller_api }}/workflow_job_templates/{{ wft_map[item.0.workflow_template] }}/notification_templates_success/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body: "{{ {'id': (notif_map[item.1] | int)} | to_json }}"
        status_code: [204]
      loop: "{{ exp_notif_assocs | subelements('success_notifications', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.workflow_template }} success <- {{ item.1 }}"

    - name: Error notifications are associated with workflow templates
      ansible.builtin.uri:
        url: "{{ controller_api }}/workflow_job_templates/{{ wft_map[item.0.workflow_template] }}/notification_templates_error/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body: "{{ {'id': (notif_map[item.1] | int)} | to_json }}"
        status_code: [204]
      loop: "{{ exp_notif_assocs | subelements('error_notifications', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.workflow_template }} error <- {{ item.1 }}"

    - name: Approval notifications are associated with workflow templates
      ansible.builtin.uri:
        url: "{{ controller_api }}/workflow_job_templates/{{ wft_map[item.0.workflow_template] }}/notification_templates_approvals/"
        method: POST
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
        body_format: json
        body: "{{ {'id': (notif_map[item.1] | int)} | to_json }}"
        status_code: [204]
      loop: "{{ exp_notif_assocs | subelements('approval_notifications', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.workflow_template }} approval <- {{ item.1 }}"

    # ── Summary ──────────────────────────────────────────────────

    - name: Import summary
      ansible.builtin.debug:
        msg:
          - "Import complete to organization: {{ target_org }}"
          - "Source: {{ org_name }}"
          - "Default resources cleaned up: Demo Job Template, Demo Project, Demo Credential, Demo Inventory"
          - "Galaxy credential associated: {{ galaxy_cred.json.count | default(0) | int > 0 }}"
          - "Users: {{ exp_users | length }}"
          - "Teams: {{ exp_teams | length }}"
          - "Org Roles: {{ exp_roles | length }}"
          - "Credentials: {{ exp_creds | length }}"
          - "Inventories: {{ exp_inventories | length }}"
          - "Hosts: {{ exp_hosts | length }}"
          - "Groups: {{ exp_groups | length }}"
          - "Projects: {{ exp_projects | length }}"
          - "Job Templates: {{ exp_jts | length }}"
          - "  Surveys: {{ exp_jt_surveys | length }}"
          - "  Schedules: {{ exp_schedules | length }}"
          - "Workflow Templates: {{ exp_wfts | length }}"
          - "  Surveys: {{ exp_wft_surveys | length }}"
          - "Notification Templates: {{ exp_notifs | length }}"
          - "Workflow Edges: {{ edge_ops | length }}"
          - ""
          - "SSH key injected from: {{ ssh_key_file }}"


- name: Create additional demo organizations
  ansible.builtin.import_playbook: create_other_orgs.yml
