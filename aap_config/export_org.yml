---
- name: Export AAP Controller organization resources
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    controller_api: "{{ controller_host }}/api/controller/v2"
    export_dir: "{{ playbook_dir }}/export/{{ org_name | lower }}"

  tasks:
    - name: Export directory structure is present
      ansible.builtin.file:
        path: "{{ export_dir }}/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - ""
        - credentials
        - inventories
        - projects
        - job_templates
        - workflow_templates
        - notification_templates
        - users
        - teams
        - roles
        - schedules

    - name: Organization is retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/organizations/?name={{ org_name | urlencode }}"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      register: org_result

    - name: Organization ID is set
      ansible.builtin.set_fact:
        org_id: "{{ org_result.json.results[0].id }}"

    - name: Organization data is saved
      ansible.builtin.copy:
        content: |
          ---
          {% for o in org_result.json.results %}
          - name: {{ o.name }}
            description: "{{ o.description }}"
          {% endfor %}
        dest: "{{ export_dir }}/organization.yml"
        mode: '0644'

    # ── Credentials ──────────────────────────────────────────────

    - name: Credential data is retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/credentials/?organization={{ org_id }}&page_size=100"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      register: creds_result

    - name: Credential data is saved
      ansible.builtin.copy:
        content: |
          ---
          {% for c in creds_result.json.results %}
          - name: {{ c.name }}
            description: "{{ c.description }}"
            credential_type: "{{ c.summary_fields.credential_type.name }}"
            inputs:
          {% for key, val in c.inputs.items() %}
              {{ key }}: "{{ val }}"
          {% endfor %}
          {% endfor %}
        dest: "{{ export_dir }}/credentials/all.yml"
        mode: '0644'

    # ── Inventories ──────────────────────────────────────────────

    - name: Inventory data is retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/inventories/?organization={{ org_id }}&page_size=100"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      register: inv_result

    - name: Inventory data is saved
      ansible.builtin.copy:
        content: |
          ---
          {% for i in inv_result.json.results %}
          - name: {{ i.name }}
            description: "{{ i.description }}"
            variables: "{{ i.variables | default('') }}"
          {% endfor %}
        dest: "{{ export_dir }}/inventories/inventories.yml"
        mode: '0644'

    - name: Hosts per inventory are retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/inventories/{{ item.id }}/hosts/?page_size=200"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      loop: "{{ inv_result.json.results }}"
      loop_control:
        label: "{{ item.name }}"
      register: hosts_result

    - name: Host data is saved
      ansible.builtin.copy:
        content: |
          ---
          {% for inv_hosts in hosts_result.results %}
          {% for h in inv_hosts.json.results %}
          - name: {{ h.name }}
            inventory: "{{ inv_hosts.item.name }}"
            enabled: {{ h.enabled | lower }}
            description: "{{ h.description }}"
            variables: "{{ h.variables | default('') }}"
          {% endfor %}
          {% endfor %}
        dest: "{{ export_dir }}/inventories/hosts.yml"
        mode: '0644'

    - name: Groups per inventory are retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/inventories/{{ item.id }}/groups/?page_size=200"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      loop: "{{ inv_result.json.results }}"
      loop_control:
        label: "{{ item.name }}"
      register: groups_result

    - name: All groups are collected
      ansible.builtin.set_fact:
        all_groups: "{{ groups_result.results | map(attribute='json') | map(attribute='results') | flatten }}"

    - name: Hosts per group are retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/groups/{{ item.id }}/hosts/?page_size=200"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      loop: "{{ all_groups }}"
      loop_control:
        label: "{{ item.name }}"
      register: group_hosts_result
      when: all_groups | length > 0

    - name: Group data with host memberships is saved
      ansible.builtin.copy:
        content: |
          ---
          {% for idx in range(all_groups | length) %}
          {% set g = all_groups[idx] %}
          - name: {{ g.name }}
            inventory: "{{ g.summary_fields.inventory.name }}"
            description: "{{ g.description }}"
            variables: "{{ g.variables | default('') }}"
            hosts:
          {% if group_hosts_result.results is defined and group_hosts_result.results[idx].json is defined %}
          {% for h in group_hosts_result.results[idx].json.results %}
              - {{ h.name }}
          {% endfor %}
          {% endif %}
          {% endfor %}
        dest: "{{ export_dir }}/inventories/groups.yml"
        mode: '0644'

    # ── Projects ─────────────────────────────────────────────────

    - name: Project data is retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/projects/?organization={{ org_id }}&page_size=100"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      register: proj_result

    - name: Project data is saved
      ansible.builtin.copy:
        content: |
          ---
          {% for p in proj_result.json.results %}
          - name: {{ p.name }}
            description: "{{ p.description }}"
            scm_type: {{ p.scm_type }}
            scm_url: {{ p.scm_url }}
            scm_branch: "{{ p.scm_branch }}"
            scm_clean: {{ p.scm_clean | lower }}
            scm_delete_on_update: {{ p.scm_delete_on_update | lower }}
            scm_update_on_launch: {{ p.scm_update_on_launch | lower }}
          {% endfor %}
        dest: "{{ export_dir }}/projects/all.yml"
        mode: '0644'

    # ── Job Templates ────────────────────────────────────────────

    - name: Job template data is retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/job_templates/?organization={{ org_id }}&page_size=100"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      register: jt_result

    - name: Credentials per job template are retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/job_templates/{{ item.id }}/credentials/?page_size=50"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      loop: "{{ jt_result.json.results }}"
      loop_control:
        label: "{{ item.name }}"
      register: jt_creds_result

    - name: Job template data is saved
      ansible.builtin.copy:
        content: |
          ---
          {% for idx in range(jt_result.json.results | length) %}
          {% set jt = jt_result.json.results[idx] %}
          {% set creds = jt_creds_result.results[idx].json.results %}
          - name: {{ jt.name }}
            description: "{{ jt.description }}"
            job_type: {{ jt.job_type }}
            playbook: {{ jt.playbook }}
            inventory: "{{ jt.summary_fields.inventory.name | default('') }}"
            project: "{{ jt.summary_fields.project.name | default('') }}"
            credentials:
          {% for c in creds %}
              - "{{ c.name }}"
          {% endfor %}
            become_enabled: {{ jt.become_enabled | lower }}
            forks: {{ jt.forks }}
            verbosity: {{ jt.verbosity }}
            extra_vars: "{{ jt.extra_vars | default('') }}"
            limit: "{{ jt.limit | default('') }}"
            job_tags: "{{ jt.job_tags | default('') }}"
            skip_tags: "{{ jt.skip_tags | default('') }}"
            diff_mode: {{ jt.diff_mode | lower }}
            survey_enabled: {{ jt.survey_enabled | lower }}
          {% endfor %}
        dest: "{{ export_dir }}/job_templates/all.yml"
        mode: '0644'

    # ── Job Template Surveys ─────────────────────────────────────

    - name: Job template survey specs are retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/job_templates/{{ item.id }}/survey_spec/"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      loop: "{{ jt_result.json.results | selectattr('survey_enabled') | list }}"
      loop_control:
        label: "{{ item.name }}"
      register: jt_survey_result

    - name: Job template survey data is saved
      ansible.builtin.copy:
        content: |
          ---
          {% for r in jt_survey_result.results | default([]) %}
          {% if r.json.spec is defined and r.json.spec | length > 0 %}
          - job_template: "{{ r.item.name }}"
            survey_spec: {{ r.json | to_json }}
          {% endif %}
          {% endfor %}
        dest: "{{ export_dir }}/job_templates/surveys.yml"
        mode: '0644'

    # ── Schedules ────────────────────────────────────────────────

    - name: Schedules per job template are retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/job_templates/{{ item.id }}/schedules/?page_size=50"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      loop: "{{ jt_result.json.results }}"
      loop_control:
        label: "{{ item.name }}"
      register: jt_sched_result

    - name: Schedule data is saved
      ansible.builtin.copy:
        content: |
          ---
          {% for r in jt_sched_result.results %}
          {% for s in r.json.results %}
          - name: "{{ s.name }}"
            job_template: "{{ r.item.name }}"
            rrule: "{{ s.rrule }}"
            enabled: {{ s.enabled | lower }}
            description: "{{ s.description }}"
          {% endfor %}
          {% endfor %}
        dest: "{{ export_dir }}/schedules/all.yml"
        mode: '0644'

    # ── Workflow Templates ───────────────────────────────────────

    - name: Workflow template data is retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/workflow_job_templates/?organization={{ org_id }}&page_size=100"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      register: wfjt_result

    - name: Workflow nodes per template are retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/workflow_job_templates/{{ item.id }}/workflow_nodes/?page_size=200"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      loop: "{{ wfjt_result.json.results }}"
      loop_control:
        label: "{{ item.name }}"
      register: wf_nodes_result

    - name: Workflow template data is saved
      ansible.builtin.copy:
        content: |
          ---
          {% for idx in range(wfjt_result.json.results | length) %}
          {% set wf = wfjt_result.json.results[idx] %}
          {% set nodes = wf_nodes_result.results[idx].json.results %}
          - name: {{ wf.name }}
            description: "{{ wf.description }}"
            survey_enabled: {{ wf.survey_enabled | lower }}
            allow_simultaneous: {{ wf.allow_simultaneous | lower }}
            extra_vars: "{{ wf.extra_vars | default('') }}"
            nodes:
          {% for n in nodes %}
              - id: {{ n.id }}
                unified_job_template: "{{ n.summary_fields.unified_job_template.name | default('') }}"
                unified_job_type: "{{ n.summary_fields.unified_job_template.unified_job_type | default('') }}"
                success_nodes: {{ n.success_nodes }}
                failure_nodes: {{ n.failure_nodes }}
                always_nodes: {{ n.always_nodes }}
                all_parents_must_converge: {{ n.all_parents_must_converge | lower }}
          {% endfor %}
          {% endfor %}
        dest: "{{ export_dir }}/workflow_templates/all.yml"
        mode: '0644'

    # ── Workflow Template Surveys ────────────────────────────────

    - name: Workflow template survey specs are retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/workflow_job_templates/{{ item.id }}/survey_spec/"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      loop: "{{ wfjt_result.json.results | selectattr('survey_enabled') | list }}"
      loop_control:
        label: "{{ item.name }}"
      register: wft_survey_result

    - name: Workflow template survey data is saved
      ansible.builtin.copy:
        content: |
          ---
          {% for r in wft_survey_result.results | default([]) %}
          {% if r.json.spec is defined and r.json.spec | length > 0 %}
          - workflow_template: "{{ r.item.name }}"
            survey_spec: {{ r.json | to_json }}
          {% endif %}
          {% endfor %}
        dest: "{{ export_dir }}/workflow_templates/surveys.yml"
        mode: '0644'

    # ── Notification Templates ───────────────────────────────────

    - name: Notification template data is retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/notification_templates/?organization={{ org_id }}&page_size=100"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      register: notif_result

    - name: Notification template data is saved
      ansible.builtin.copy:
        content: |
          ---
          {% for n in notif_result.json.results %}
          - name: {{ n.name }}
            description: "{{ n.description }}"
            notification_type: {{ n.notification_type }}
            notification_configuration: {{ n.notification_configuration | to_json }}
          {% endfor %}
        dest: "{{ export_dir }}/notification_templates/all.yml"
        mode: '0644'

    - name: Started notification associations are retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/workflow_job_templates/{{ item.id }}/notification_templates_started/?page_size=50"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      loop: "{{ wfjt_result.json.results }}"
      loop_control:
        label: "{{ item.name }}"
      register: notif_started_result

    - name: Success notification associations are retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/workflow_job_templates/{{ item.id }}/notification_templates_success/?page_size=50"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      loop: "{{ wfjt_result.json.results }}"
      loop_control:
        label: "{{ item.name }}"
      register: notif_success_result

    - name: Error notification associations are retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/workflow_job_templates/{{ item.id }}/notification_templates_error/?page_size=50"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      loop: "{{ wfjt_result.json.results }}"
      loop_control:
        label: "{{ item.name }}"
      register: notif_error_result

    - name: Approval notification associations are retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/workflow_job_templates/{{ item.id }}/notification_templates_approvals/?page_size=50"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      loop: "{{ wfjt_result.json.results }}"
      loop_control:
        label: "{{ item.name }}"
      register: notif_approval_result

    - name: Notification association data is saved
      ansible.builtin.copy:
        content: |
          ---
          {% for idx in range(wfjt_result.json.results | length) %}
          {% set wf = wfjt_result.json.results[idx] %}
          {% set started = notif_started_result.results[idx].json.results %}
          {% set success = notif_success_result.results[idx].json.results %}
          {% set error = notif_error_result.results[idx].json.results %}
          {% set approval = notif_approval_result.results[idx].json.results %}
          {% if started | length > 0 or success | length > 0 or error | length > 0 or approval | length > 0 %}
          - workflow_template: "{{ wf.name }}"
            started_notifications:
          {% for n in started %}
              - "{{ n.name }}"
          {% endfor %}
            success_notifications:
          {% for n in success %}
              - "{{ n.name }}"
          {% endfor %}
            error_notifications:
          {% for n in error %}
              - "{{ n.name }}"
          {% endfor %}
            approval_notifications:
          {% for n in approval %}
              - "{{ n.name }}"
          {% endfor %}
          {% endif %}
          {% endfor %}
        dest: "{{ export_dir }}/notification_templates/associations.yml"
        mode: '0644'

    # ── Users ────────────────────────────────────────────────────

    - name: Organization user data is retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/organizations/{{ org_id }}/users/?page_size=100"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      register: users_result

    - name: User data is saved
      ansible.builtin.copy:
        content: |
          ---
          {% for u in users_result.json.results %}
          {% if u.username != 'admin' %}
          - username: {{ u.username }}
            first_name: "{{ u.first_name }}"
            last_name: "{{ u.last_name }}"
            email: "{{ u.email }}"
            is_superuser: {{ u.is_superuser | lower }}
          {% endif %}
          {% endfor %}
        dest: "{{ export_dir }}/users/all.yml"
        mode: '0644'

    # ── Teams ────────────────────────────────────────────────────

    - name: Organization team data is retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/organizations/{{ org_id }}/teams/?page_size=100"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      register: teams_result

    - name: Team member data is retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/teams/{{ item.id }}/users/?page_size=100"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      loop: "{{ teams_result.json.results }}"
      loop_control:
        label: "{{ item.name }}"
      register: team_members_result
      when: teams_result.json.results | length > 0

    - name: Team data with members is saved
      ansible.builtin.copy:
        content: |
          ---
          {% for idx in range(teams_result.json.results | length) %}
          {% set t = teams_result.json.results[idx] %}
          - name: "{{ t.name }}"
            description: "{{ t.description }}"
            members:
          {% if team_members_result.results is defined and team_members_result.results[idx].json is defined %}
          {% for u in team_members_result.results[idx].json.results %}
              - {{ u.username }}
          {% endfor %}
          {% endif %}
          {% endfor %}
        dest: "{{ export_dir }}/teams/all.yml"
        mode: '0644'

    # ── Organization Roles ───────────────────────────────────────

    - name: Organization role data is retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/organizations/{{ org_id }}/object_roles/?page_size=100"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      register: org_roles_result

    - name: Users per organization role are retrieved
      ansible.builtin.uri:
        url: "{{ controller_api }}/roles/{{ item.id }}/users/?page_size=100"
        user: "{{ controller_user }}"
        password: "{{ controller_pass }}"
        validate_certs: "{{ controller_verify_tls }}"
        force_basic_auth: true
      loop: "{{ org_roles_result.json.results }}"
      loop_control:
        label: "{{ item.name }}"
      register: role_users_result

    - name: Organization role data is saved
      ansible.builtin.copy:
        content: |
          ---
          {% for idx in range(org_roles_result.json.results | length) %}
          {% set role = org_roles_result.json.results[idx] %}
          {% set role_users = role_users_result.results[idx].json.results | rejectattr('username', 'equalto', 'admin') | list %}
          {% if role_users | length > 0 %}
          - role_name: "{{ role.name }}"
            users:
          {% for u in role_users %}
              - {{ u.username }}
          {% endfor %}
          {% endif %}
          {% endfor %}
        dest: "{{ export_dir }}/roles/all.yml"
        mode: '0644'

    # ── Summary ──────────────────────────────────────────────────

    - name: Export summary
      ansible.builtin.debug:
        msg:
          - "Export complete: {{ export_dir }}"
          - "Organization: {{ org_name }}"
          - "Credentials: {{ creds_result.json.count }}"
          - "Inventories: {{ inv_result.json.count }}"
          - "Hosts: {{ hosts_result.results | map(attribute='json') | map(attribute='count') | sum }}"
          - "Groups: {{ all_groups | length }}"
          - "Projects: {{ proj_result.json.count }}"
          - "Job Templates: {{ jt_result.json.count }}"
          - "  Surveys: {{ jt_survey_result.results | default([]) | length }}"
          - "  Schedules: {{ jt_sched_result.results | map(attribute='json') | map(attribute='count') | sum }}"
          - "Workflow Templates: {{ wfjt_result.json.count }}"
          - "  Surveys: {{ wft_survey_result.results | default([]) | length }}"
          - "Notification Templates: {{ notif_result.json.count }}"
          - "Users: {{ users_result.json.results | rejectattr('username', 'equalto', 'admin') | list | length }}"
          - "Teams: {{ teams_result.json.count }}"
          - "Org Roles: {{ role_users_result.results | length }}"

...
